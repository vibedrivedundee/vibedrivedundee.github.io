<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE Drive — Book your lesson</title>
<style>
  :root {
    --navy: #0C2340;
    --navy-soft: #16345c;
    --gold: #D9A441;
    --paper: #FAFAF8;
    --ink: #1C1C1C;
    --line: #E4E1D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }
  header .brand {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header .brand span { color: var(--gold); }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-size: 1.7rem;
    margin: 0 0 8px;
    color: var(--navy);
  }
  p.lede {
    color: #4a4a4a;
    margin: 0 0 28px;
    max-width: 46ch;
  }
  .instructor-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .instructor-tag .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
  }
  #cal-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: auto;
    min-height: 500px;
  }
  #my-cal-inline { width: 100%; height: 750px; }
  .fallback {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  .fallback h2 {
    margin-top: 0;
    font-size: 1.2rem;
    color: var(--navy);
  }
  .fallback p { color: #4a4a4a; }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.8rem;
    color: #9a9a9a;
  }
</style>
</head>
<body>

<header>
  <div class="brand">VIBE <span>Drive</span></div>
</header>

<main>
  <div id="content">
    <h1>Loading your booking page…</h1>
    <p class="lede">One moment while we match you with the right instructor.</p>
  </div>
</main>

<footer>VIBE Drive — Dundee. This is a demo project.</footer>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const name = (params.get('name') || '').trim();
  const email = (params.get('email') || '').trim();
  const rawPostcode = (params.get('postcode') || '').trim();
  const transmission = (params.get('transmission') || '').trim().toLowerCase();

  const INSTRUCTORS = {
    'automatic': { slug: 'lesson-with-aisha-campbell', display: 'Aisha Campbell — Automatic' },
    'DD1': { slug: 'david-thompson', display: 'David Thompson' },
    'DD2': { slug: 'david-thompson', display: 'David Thompson' },
    'DD3': { slug: 'james-wilson', display: 'James Wilson' },
    'DD4': { slug: 'emily-scott', display: 'Emily Scott' },
    'DD5': { slug: 'emily-scott', display: 'Emily Scott' }
  };

  function cleanPostcode(pc) {
    return pc.toUpperCase().replace(/\s+/g, '');
  }

  function districtCode(cleanPc) {
    return cleanPc.slice(0, 3);
  }

  function resolveInstructor() {
    if (transmission === 'automatic') return INSTRUCTORS['automatic'];
    if (!rawPostcode) return null;
    const district = districtCode(cleanPostcode(rawPostcode));
    return INSTRUCTORS[district] || null;
  }

  const content = document.getElementById('content');
  const match = resolveInstructor();

  if (!match) {
    content.innerHTML =
      '<h1>Thanks' + (name ? ', ' + escapeHtml(name) : '') + '!</h1>' +
      '<p class="lede">We couldn\'t automatically match your area to an instructor — ' +
      'no problem, we\'ll follow up by email shortly to sort out a time that works for you.</p>' +
      '<div class="fallback">' +
      '<h2>What happens next</h2>' +
      '<p>A member of the VIBE Drive team will get in touch to confirm your instructor and find a slot that fits your schedule.</p>' +
      '</div>';
    return;
  }

  content.innerHTML =
    '<h1>Book your first lesson</h1>' +
    '<p class="lede">Pick a time that works for you — pickup location as provided in your enquiry, we\'ll confirm the exact spot beforehand.</p>' +
    '<div class="instructor-tag"><span class="dot"></span> Your instructor: ' + escapeHtml(match.display) + '</div>' +
    '<div id="cal-wrap"><div id="my-cal-inline"></div></div>';

  loadCal(match.slug, name, email);

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function loadCal(slug, name, email) {
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal; let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {}; cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") {
            cal.ns[namespace] = cal.ns[namespace] || api;
            p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]);
          } else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    window.Cal("init", { origin: "https://cal.com" });
    window.Cal("inline", {
      elementOrSelector: "#my-cal-inline",
      calLink: "vibedrivedundee/" + slug,
      config: { name: name, email: email, layout: "month_view" }
    });
    window.Cal("ui", {
      styles: { branding: { brandColor: "#0C2340" } },
      hideEventTypeDetails: false,
      layout: "month_view"
    });
  }
})();
</script>

</body>
</html>
